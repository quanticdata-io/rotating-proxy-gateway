version: "2"
linters:
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        # Closing a connection or a body we are done with: nothing useful to do on error.
        - (net.Conn).Close
        - (net.Listener).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*github.com/quanticdata-io/rotating-proxy-gateway/internal/testutil.SOCKS5).Close
        # Writes to the terminal.
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G402 # InsecureSkipVerify is an explicit opt-in flag (--insecure)
        - G107 # URLs come from the user by design
        - G304 # reading the upstream list file the user names is the point
        - G104 # unchecked Close on finished connections, same list as errcheck above
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, unparam, errcheck]
      - path: internal/testutil/
        linters: [gosec, errcheck]
      - path: examples/
        linters: [gosec]
formatters:
  enable:
    - gofmt
